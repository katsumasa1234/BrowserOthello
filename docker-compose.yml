services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FRONTEND_URL=http://localhost:82
    restart: unless-stopped
    networks:
      - othello-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "82:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - othello-network

networks:
  othello-network:
    driver: bridge
